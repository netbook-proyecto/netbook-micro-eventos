spring.application.name=evento

spring.web.error.include-binding-errors=always
spring.web.error.include-message=always



spring.datasource.url=jdbc:mysql://localhost:3306/evento?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=evento
spring.datasource.password=system


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

server.port=5010

springdoc.swagger-ui.path=/reporte.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operations-sorter=alpha

app.name=Gestion de Evento
app.version=1.0.1




